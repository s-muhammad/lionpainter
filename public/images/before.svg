<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2=".45" y2="1">
      <stop offset="0" stop-color="#8D8272"/>
      <stop offset="1" stop-color="#6E6558"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFE0BE"/>
      <stop offset=".5" stop-color="#DCC79E"/>
      <stop offset="1" stop-color="#8FA08A"/>
    </linearGradient>
    <linearGradient id="sofaGrad" x1="0" y1="0" x2=".2" y2="1">
      <stop offset="0" stop-color="#C9BFAE"/>
      <stop offset="1" stop-color="#C9BFAE" stop-opacity=".78"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A4238"/>
      <stop offset="1" stop-color="#15120F"/>
    </linearGradient>
    <radialGradient id="glow" cx=".62" cy=".42" r=".62">
      <stop offset="0" stop-color="#FFF3D3" stop-opacity=".42"/>
      <stop offset="1" stop-color="#FFF3D3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx=".5" cy=".45" r=".78">
      <stop offset=".45" stop-color="#08131B" stop-opacity="0"/>
      <stop offset="1" stop-color="#08131B" stop-opacity="0.18"/>
    </radialGradient>
    
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#EBD49B"/>
    <stop offset="0.5" stop-color="#C6A45F"/>
    <stop offset="1" stop-color="#967536"/>
  </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="softSm"><feGaussianBlur stdDeviation="5"/></filter>
    
  <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0" result="g"/>
    <feComponentTransfer in="g" result="t">
      <feFuncA type="linear" slope="0.14" intercept="0"/>
    </feComponentTransfer>
    <feComposite in="t" in2="SourceGraphic" operator="in"/>
  </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#wall)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- ceiling & mouldings -->
  <rect x="0" y="0" width="1600" height="45" fill="#08131B" opacity=".22"/>
  <rect x="0" y="45" width="1600" height="6" fill="#C9BFAE" opacity=".18"/>
  <rect x="0" y="90" width="1600" height="7" fill="#000" opacity=".16"/>
  <rect x="0" y="97" width="1600" height="2" fill="#9C8A6A" opacity=".5"/>
  <rect x="0" y="735" width="1600" height="16" fill="#000" opacity=".14"/>
  <rect x="0" y="751" width="1600" height="14" fill="#C9BFAE" opacity=".24"/>

  <!-- floor -->
  <rect x="0" y="765" width="1600" height="235" fill="url(#floorGrad)"/>
  <g stroke="#F6E9CF" stroke-opacity=".055" stroke-width="2">
    <path d="M0 1000 L510 765"/><path d="M160 1000 L568 765"/><path d="M320 1000 L626 765"/><path d="M480 1000 L684 765"/><path d="M640 1000 L742 765"/><path d="M800 1000 L800 765"/><path d="M960 1000 L858 765"/><path d="M1120 1000 L916 765"/><path d="M1280 1000 L974 765"/><path d="M1440 1000 L1032 765"/><path d="M1600 1000 L1090 765"/>
    <path d="M0 799 H1600"/><path d="M0 843 H1600"/><path d="M0 887 H1600"/><path d="M0 931 H1600"/>
  </g>

  <!-- rug -->
  <g>
    <path d="M288 799 H1312 L1472 984 H128 Z" fill="#C9BFAE" opacity=".12"/>
    <path d="M328 811 H1272 L1408 972 H192 Z" fill="none" stroke="#9C8A6A" stroke-width="2" opacity=".35"/>
    <path d="M384 825 L1232 960 M1216 825 L368 960" stroke="#9C8A6A" stroke-width="1.5" opacity=".12"/>
  </g>

  <!-- window -->
  <g>
    <rect x="810" y="93" width="556" height="669" fill="#C9BFAE" opacity=".13"/>
    <path d="M832 740 L832 371 A256 256 0 0 1 1344 371 L1344 740 Z" fill="url(#sky)"/>
    <g opacity=".3" fill="#46503F">
      <path d="M862.72 740 L903.6800000000001 527.5 L975.36 740Z"/>
      <path d="M1190.4 740 L1251.84 502.5 L1323.52 740Z"/>
    </g>
    <path d="M832 740 L832 371 A256 256 0 0 1 1344 371 L1344 740 Z" fill="none" stroke="#9C8A6A" stroke-opacity=".6" stroke-width="5"/>
    <g stroke="#9C8A6A" stroke-opacity=".45" stroke-width="3">
      <path d="M1088 123 V740"/>
      <path d="M832 502.5 H1344"/>
    </g>
    <rect x="826" y="740" width="524" height="14" fill="#C9BFAE" opacity=".45"/>
  </g>

  <!-- curtains -->
  <g>
    <rect x="736" y="69" width="704" height="8" rx="4" fill="url(#gold)" opacity=".7"/>
    <path d="M740 75 C782 195 754 458.75 774 781
             L824 781 C804 427.5 826 215 840 75 Z"
          fill="#C9BFAE" opacity=".38"/>
    <path d="M1436 75 C1394 195 1422 458.75 1402 781
             L1352 781 C1372 427.5 1350 215 1336 75 Z"
          fill="#C9BFAE" opacity=".34"/>
    <g stroke="#000" stroke-opacity=".08" stroke-width="2" fill="none">
      <path d="M758 85 C784 305 778 583.75 788 765"/>
      <path d="M1418 85 C1392 305 1398 583.75 1388 765"/>
    </g>
  </g>

  <path d="M893.44 145 L1262.08 145 L1422.08 795 L783.44 795 Z" fill="#FFF3D6" opacity="0.22" filter="url(#soft)"/>
  <rect width="1600" height="1000" fill="#0C1E2E" opacity="0.04"/>

  <!-- artwork -->
  
    <g>
      <rect x="545" y="189" width="336" height="265" fill="#000" opacity=".2"/>
      <rect x="536" y="175" width="336" height="265" fill="url(#gold)"/>
      <rect x="544" y="183" width="320" height="249" fill="#F3ECDD"/>
      <rect x="553" y="192" width="302" height="231" fill="#1B2B33"/>
      <g transform="translate(704 307.5) scale(1.4198000000000002)"><g>
        <circle cx="0" cy="-26" r="88" fill="#9C8A6A" opacity=".85"/>
        <circle cx="34" cy="-70" r="30" fill="#F3ECDD" opacity=".65"/>
        <path d="M-104 84 Q -20 -40 104 84" fill="none" stroke="#F3ECDD" stroke-width="12" opacity=".75"/>
        <path d="M-84 104 Q 0 4 84 104" fill="none" stroke="#9C8A6A" stroke-width="4" opacity=".65"/>
      </g></g>
    </g>

  <!-- console under the artwork -->
  <g>
    <rect x="504" y="533" width="400" height="9" rx="4" fill="url(#gold)" opacity=".8"/>
    <rect x="528" y="542" width="6" height="90" fill="url(#gold)" opacity=".55"/>
    <rect x="876.8000000000001" y="542" width="6" height="90" fill="url(#gold)" opacity=".55"/>
    <path d="M664 533 h24 l-5 -42 h-14 z" fill="#EDE4D2" opacity=".92"/>
    <g stroke="#66765C" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M680 491 q -10 -30 -28 -44"/>
      <path d="M691.2 491 q 6 -34 24 -48"/>
      <path d="M684.8 491 q -2 -26 4 -42"/>
    </g>
    <rect x="752" y="522" width="56" height="11" rx="2" fill="#E7DBC4" opacity=".9"/>
    <rect x="756.8" y="511" width="42" height="11" rx="2" fill="#9C8A6A" opacity=".75"/>
  </g>

  <!-- sofa -->
  <g>
    <ellipse cx="760" cy="789" rx="480" ry="16" fill="#000" opacity=".25" filter="url(#softSm)"/>
    <rect x="488" y="607" width="624" height="62" rx="22" fill="url(#sofaGrad)"/>
    <rect x="448.00000000000006" y="653" width="704" height="86" rx="16" fill="url(#sofaGrad)"/>
    <g fill="none" stroke="#000" stroke-opacity=".09" stroke-width="2">
      <rect x="483.2" y="617" width="288" height="56" rx="14"/>
      <rect x="828.8000000000001" y="617" width="288" height="56" rx="14"/>
      <rect x="480" y="677" width="304" height="52" rx="10"/>
      <rect x="816" y="677" width="304" height="52" rx="10"/>
    </g>
    <rect x="488" y="615" width="68" height="66" rx="12" transform="rotate(-6 488 615)" fill="#9C8A6A" opacity=".82"/>
    <rect x="960" y="613" width="60" height="64" rx="12" transform="rotate(5 960 613)" fill="#C9BFAE" opacity=".95" stroke="#000" stroke-opacity=".1"/>
    <path d="M463.99999999999994 649 q 30 -18 56 6 q -10 44 -58 46 z" fill="#C9BFAE" opacity=".55"/>
    <rect x="448.00000000000006" y="733" width="704" height="10" fill="#000" opacity=".14"/>
    <g stroke="#3A3126" stroke-width="6" opacity=".6">
      <path d="M496 743 V777"/>
      <path d="M1072 743 V777"/>
    </g>
  </g>

  <!-- coffee table -->
  <g>
    <ellipse cx="752" cy="861" rx="256" ry="16" fill="#000" opacity=".3"/>
    <rect x="576" y="813" width="352" height="12" rx="6" fill="url(#gold)" opacity=".85"/>
    <rect x="632" y="825" width="7" height="52" fill="url(#gold)" opacity=".55"/>
    <rect x="864" y="825" width="7" height="52" fill="url(#gold)" opacity=".55"/>
    <g>
      <path d="M696 813 h30 l-5 -20 h-20 z" fill="#EDE4D2" opacity=".95"/>
      <path d="M704 807 q -16 -8 -14 -24 M744 805 q 4 -22 18 -30 M732.8000000000001 807 q -6 -24 -22 -30" stroke="#7F8F72" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
    <rect x="808" y="799" width="60" height="10" rx="2" fill="#E9DDC7" opacity=".9"/>
    <rect x="808" y="788" width="46" height="10" rx="2" fill="#9C8A6A" opacity=".8"/>
  </g>

  <!-- side table & lamp -->
  <g>
    <rect x="1208" y="707" width="176" height="8" rx="4" fill="url(#gold)" opacity=".7"/>
    <path d="M1228.8 715 V791 M1363.2 715 V791" stroke="url(#gold)" stroke-width="4" opacity=".55"/>
    <rect x="1288" y="605" width="6" height="102" fill="url(#gold)" opacity=".6"/>
    <path d="M1252 611 h78 l-15 -50 h-48 z" fill="#F3E6C8" opacity=".92"/>
    <ellipse cx="1288" cy="609" rx="58" ry="10" fill="#FFF3D3" opacity=".3" filter="url(#softSm)"/>
    <circle cx="1288" cy="605" r="4" fill="#FFF3D3" opacity=".8"/>
  </g>

  <!-- plant -->
  <g transform="translate(1448 775)">
    <path d="M-24 0 h48 l-8 60 h-32 z" fill="#3A3126" opacity=".85"/>
    <path d="M-24 0 h48 l-2 10 h-44 z" fill="url(#gold)" opacity=".5"/>
    <g stroke="#586B57" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M0 0 C-4 -50 -26 -62 -38 -94"/>
      <path d="M2 -6 C12 -54 34 -66 44 -100"/>
      <path d="M0 -10 C-2 -60 4 -92 0 -124"/>
      <path d="M-38 -94 q -24 -4 -28 -26 q 26 -2 28 26"/>
      <path d="M44 -100 q 26 -4 30 -26 q -28 -2 -30 26"/>
      <path d="M0 -124 q 2 -26 -12 -40 q -16 20 12 40"/>
    </g>
  </g>

  <rect width="1600" height="1000" fill="url(#vignette)"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity=".5"/>
</svg>
