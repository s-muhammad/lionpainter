<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img">
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26384B"/>
      <stop offset="1" stop-color="#5E6C64"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="30"/></filter>
    
  <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0" result="g"/>
    <feComponentTransfer in="g" result="t">
      <feFuncA type="linear" slope="0.14" intercept="0"/>
    </feComponentTransfer>
    <feComposite in="t" in2="SourceGraphic" operator="in"/>
  </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#t)"/>
  <circle cx="864" cy="270" r="288" fill="#C6A45F" opacity=".4" filter="url(#soft)"/>
  <path d="M0 630 C 300 360 720 810 1200 495.00000000000006 V900 H0 Z" fill="#000" opacity=".18"/>
  <g stroke="#C6A45F" stroke-width="2" opacity=".4">
    <circle cx="600" cy="405" r="70" fill="none"/><circle cx="600" cy="405" r="104" fill="none"/><circle cx="600" cy="405" r="138" fill="none"/><circle cx="600" cy="405" r="172" fill="none"/><circle cx="600" cy="405" r="206" fill="none"/><circle cx="600" cy="405" r="240" fill="none"/><circle cx="600" cy="405" r="274" fill="none"/><circle cx="600" cy="405" r="308" fill="none"/>
  </g>
  <rect width="1200" height="900" filter="url(#grain)" opacity=".55"/>
</svg>
